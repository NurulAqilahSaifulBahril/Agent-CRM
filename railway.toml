[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "node scripts/start.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

# Southeast Asia Metal (Singapore). This overrides the Scale region in the dashboard.
[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
